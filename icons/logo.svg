    <!-- viewfinder brackets -->
    <path class="ink" d="M28 66 V50 a14 14 0 0 1 14 -14 h16" stroke="#17171a" stroke-width="10"/>
    <path class="ink" d="M138 36 h16 a14 14 0 0 1 14 14 v16" stroke="#17171a" stroke-width="10"/>
    <path class="ink" d="M168 134 v16 a14 14 0 0 1 -14 14 h-16" stroke="#17171a" stroke-width="10"/>
    <path class="ink" d="M62 164 h-16 a14 14 0 0 1 -14 -14 v-16" stroke="#17171a" stroke-width="10"/>
    <!-- document sheet -->
