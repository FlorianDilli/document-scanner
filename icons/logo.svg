    <!-- text lines -->
    <path class="ink" d="M84 82 h32" stroke="#17171a" stroke-width="8"/>
    <path class="ink" d="M84 98 h32" stroke="#17171a" stroke-width="8"/>
    <path class="ink" d="M84 114 h18" stroke="#17171a" stroke-width="8"/>
