<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dokumenten-Scanner</title>
  <meta name="description" content="Kostenloser, privater Dokumenten-Scanner – alles läuft lokal in deinem Browser.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ededeb">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0b0c">
  <!-- Restrictive CSP: everything must come from this origin. No CDNs, no telemetry. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' blob: data:; worker-src 'self' blob:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self';">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/logo.svg" type="image/svg+xml" sizes="any">
  <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Keep status-bar-style "default" on purpose (it even composites
       the page edge-to-edge behind the status bar on iOS 26):
       "black-translucent" makes iOS 26 render its Liquid Glass
       material over the top of the app on EVERY screen (a frosted
       haze around the status items) – observed live, and why this
       was reverted. Read at install time: changing this value
       requires re-adding the home screen web app. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- Must run before the stylesheet paints (see js/viewport.js). -->
  <script src="./js/viewport.js"></script>
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <header id="app-header">
    <img id="app-logo" src="./icons/logo.svg" alt="" width="46" height="46">
    <div id="app-heading">
      <h1 id="app-title"><span data-i18n="appTitle">Dokumenten-Scanner</span></h1>
      <p id="app-subtitle" data-i18n="appSubtitle">Scanne deine Dokumente und exportiere sie einfach.</p>
    </div>
  </header>

  <main id="app-main">
    <!-- ============ HOME: page list ============ -->
    <section id="view-home" class="view">
      <div id="import-card" class="card import-card">
        <div class="card-head">
          <h3 data-i18n="newScan">Neu scannen</h3>
        </div>
        <p class="hint" data-i18n="newScanHint">Wähle eine Quelle, um ein Dokument zu scannen.</p>
        <div id="import-buttons">
          <button id="btn-camera" class="btn btn-tile" type="button">
            <span class="icon-slot" data-icon="camera"></span>
            <span data-i18n="takePhoto">Foto aufnehmen</span>
            <span class="tile-arrow" data-icon="arrow"></span>
          </button>
          <button id="btn-gallery" class="btn btn-tile" type="button">
            <span class="icon-slot" data-icon="image"></span>
            <span data-i18n="fromGallery">Aus Galerie wählen</span>
            <span class="tile-arrow" data-icon="arrow"></span>
          </button>
        </div>
      </div>
      <div id="page-grid" class="page-grid"></div>
      <p id="empty-state" class="empty-state" data-i18n="emptyState">Noch keine Seiten. Fotografiere oder importiere ein Dokument, um zu beginnen.</p>
      <div id="home-footer" class="home-footer hidden">
        <span id="page-counter" class="page-counter"></span>
          <button id="btn-export" class="btn btn-success" type="button">
            <span class="icon-slot" data-icon="download"></span>
            <span data-i18n="exportAction">Exportieren</span>
          </button>
      </div>
    </section>

    <!-- ============ PAGE EDITOR: frame + look ============ -->
    <section id="view-editor" class="view hidden">
      <div class="view-toolbar">
        <button id="btn-editor-back" class="btn" type="button">
          <span class="icon-slot" data-icon="back"></span>
          <span data-i18n="back">Zurück</span>
        </button>
        <div class="mode-switch" role="tablist">
          <button id="mode-frame" class="mode-btn" role="tab" aria-selected="true" type="button">
            <span class="icon-slot" data-icon="crop"></span>
            <span data-i18n="modeFrame">Rahmen</span>
          </button>
          <button id="mode-look" class="mode-btn" role="tab" aria-selected="false" type="button">
            <span class="icon-slot" data-icon="sliders"></span>
            <span data-i18n="modeLook">Optik</span>
          </button>
        </div>
        <button id="btn-editor-done" class="btn btn-success btn-done" type="button">
          <span class="icon-slot" data-icon="check"></span>
          <span class="sr-only" data-i18n="done">Fertig</span>
        </button>
      </div>

      <div id="frame-pane" class="pane">
        <div id="frame-stage" class="crop-stage">
          <canvas id="crop-canvas"></canvas>
        </div>
        <div class="view-toolbar crop-actions">
          <button id="btn-redetect" class="btn" type="button">
            <span class="icon-slot" data-icon="wand"></span>
            <span data-i18n="redetect">Erneut erkennen</span>
          </button>
          <button id="btn-reset-crop" class="btn" type="button">
            <span class="icon-slot" data-icon="expand"></span>
            <span data-i18n="resetCrop">Auf ganzes Bild</span>
          </button>
          <button id="btn-rotate-left" class="btn" type="button" aria-label="Links">
            <span class="icon-slot" data-icon="rotateL"></span>
            <span data-i18n="rotateLeft">Links</span>
          </button>
          <button id="btn-rotate-right" class="btn" type="button" aria-label="Rechts">
            <span class="icon-slot" data-icon="rotateR"></span>
            <span data-i18n="rotateRight">Rechts</span>
          </button>
        </div>
      </div>

      <div id="look-pane" class="pane hidden">
        <div id="edit-preview-wrap" class="edit-preview-wrap">
          <canvas id="edit-preview"></canvas>
          <div id="edit-spinner" class="spinner hidden"></div>
          <div id="zoom-controls" class="zoom-controls">
            <button id="btn-zoom-out" class="btn btn-icon" type="button">
              <span class="icon-slot" data-icon="zoomOut"></span>
            </button>
            <button id="btn-zoom-in" class="btn btn-icon" type="button">
              <span class="icon-slot" data-icon="zoomIn"></span>
            </button>
          </div>
        </div>
        <div id="filter-chips" class="chip-row"></div>
        <div class="card sliders-card">
          <div class="slider-row">
            <label for="slider-brightness" data-i18n="brightness">Helligkeit</label>
            <input type="range" id="slider-brightness" min="-100" max="100" value="0">
            <span id="val-brightness" class="slider-val">0</span>
          </div>
          <div class="slider-row">
            <label for="slider-contrast" data-i18n="contrast">Kontrast</label>
            <input type="range" id="slider-contrast" min="-100" max="100" value="0">
            <span id="val-contrast" class="slider-val">0</span>
          </div>
          <div class="slider-row">
            <label for="slider-sharpen" data-i18n="sharpen">Schärfe</label>
            <input type="range" id="slider-sharpen" min="0" max="100" value="0">
            <span id="val-sharpen" class="slider-val">0</span>
          </div>
        </div>
      </div>

      <!-- Filmstrip page switcher: previews of all pages, tap to jump.
           Mobile: sticky rail at the bottom; desktop: fixed rail on
           the left edge of the screen. Built by views/pageEditor.js. -->
      <nav id="page-filmstrip" class="page-filmstrip" aria-label="Seiten"></nav>
    </section>

    <!-- ============ EXPORT ============ -->
    <section id="view-export" class="view hidden">
      <div class="view-toolbar">
        <button id="btn-export-back" class="btn" type="button">
          <span class="icon-slot" data-icon="back"></span>
          <span data-i18n="back">Zurück</span>
        </button>
        <span class="toolbar-title" data-i18n="exportTitle">Export</span>
        <span></span>
      </div>
      <div class="export-options">
        <div class="option-row">
          <span class="option-label" data-i18n="format">Format</span>
          <div class="format-switch" id="opt-format" role="radiogroup">
            <button class="format-btn" type="button" role="radio" aria-checked="true" data-format="pdf">
              <span class="icon-slot" data-icon="pdf"></span>
              <span data-i18n="formatPdf">PDF</span>
            </button>
            <button class="format-btn" type="button" role="radio" aria-checked="false" data-format="images">
              <span class="icon-slot" data-icon="image"></span>
              <span data-i18n="formatImages">Bilder</span>
            </button>
          </div>
        </div>
        <div class="option-row">
          <label for="opt-quality" data-i18n="quality">Qualität</label>
          <select id="opt-quality">
            <option value="0.7" data-i18n="qualityLow">Niedrig</option>
            <option value="0.85" data-i18n="qualityMedium">Mittel</option>
            <option value="0.95" selected data-i18n="qualityHigh">Hoch</option>
          </select>
        </div>
        <div class="option-row" id="row-ocr">
          <label for="opt-ocr" data-i18n="ocrToggle">Text erkennen (OCR)</label>
          <input type="checkbox" id="opt-ocr" checked>
        </div>
        <div class="option-row">
          <label for="opt-filename" data-i18n="filename">Dateiname</label>
          <input type="text" id="opt-filename" value="scan.pdf">
        </div>
      </div>
      <p id="format-hint" class="format-hint hidden" data-i18n="formatHintImages"></p>
      <div id="export-progress" class="export-progress hidden">
        <div class="progress-bar"><div id="export-progress-fill"></div></div>
        <p id="export-progress-text"></p>
        <button id="btn-export-cancel" class="btn btn-danger" type="button" data-i18n="cancel">Abbrechen</button>
      </div>
      <button id="btn-export-start" class="btn btn-success btn-big" type="button" data-i18n="startExport">PDF erstellen</button>
    </section>
  </main>

  <!-- Desktop page previews: fixed left sidebar while editing
       (hidden on phones and outside the editor; built by
       views/sidebar.js). -->
  <aside id="page-sidebar" class="page-sidebar"></aside>

  <!-- Install / update / toast UI -->
  <div id="install-banner" class="banner hidden">
    <span data-i18n="installHint">App installieren</span>
    <div>
      <button id="btn-install" class="btn btn-primary" type="button" data-i18n="install">Installieren</button>
      <button id="btn-install-dismiss" class="btn" type="button" data-i18n="dismiss">Nicht jetzt</button>
    </div>
  </div>
  <div id="update-banner" class="banner hidden">
    <span data-i18n="updateHint">Neue Version verfügbar</span>
    <div>
      <button id="btn-update" class="btn btn-primary" type="button" data-i18n="reload">Neu laden</button>
    </div>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <div id="busy-overlay" class="busy-overlay hidden">
    <div class="spinner"></div>
    <p id="busy-text"></p>
  </div>

  <!-- In-app camera capture: opens the camera directly (no file-picker menu) -->
  <div id="camera-view" class="camera-view hidden" aria-hidden="true">
    <video id="camera-video" autoplay playsinline muted></video>
    <div class="camera-actions">
      <button id="btn-camera-cancel" class="icon-btn" type="button">
        <span class="icon-slot" data-icon="close"></span>
      </button>
      <button id="btn-camera-shutter" class="btn-camera-shutter" type="button" disabled></button>
    </div>
  </div>

  <!-- Vendor libraries (classic scripts, self-hosted, pinned versions) -->
  <script src="./vendor/pdf-lib/pdf-lib.min.js"></script>
  <script src="./vendor/pdf-lib/fontkit.umd.min.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
